name: Public safety

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan public repository content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Scanner self-test
        run: python3 tools/public_safety_scan.py --self-test

      - name: Scan tracked files
        env:
          PUBLIC_SAFETY_PRIVATE_TERMS: ${{ secrets.PUBLIC_SAFETY_PRIVATE_TERMS }}
          PUBLIC_SAFETY_PRIVATE_RULES: ${{ secrets.PUBLIC_SAFETY_PRIVATE_RULES }}
          PUBLIC_SAFETY_PRIVATE_RULES_1: ${{ secrets.PUBLIC_SAFETY_PRIVATE_RULES_1 }}
          PUBLIC_SAFETY_PRIVATE_RULES_2: ${{ secrets.PUBLIC_SAFETY_PRIVATE_RULES_2 }}
          PUBLIC_SAFETY_PRIVATE_RULES_3: ${{ secrets.PUBLIC_SAFETY_PRIVATE_RULES_3 }}
          PUBLIC_SAFETY_PRIVATE_RULES_4: ${{ secrets.PUBLIC_SAFETY_PRIVATE_RULES_4 }}
          PUBLIC_SAFETY_PRIVATE_RULES_5: ${{ secrets.PUBLIC_SAFETY_PRIVATE_RULES_5 }}
          PUBLIC_SAFETY_PRIVATE_RULES_6: ${{ secrets.PUBLIC_SAFETY_PRIVATE_RULES_6 }}
          PUBLIC_SAFETY_PRIVATE_RULES_7: ${{ secrets.PUBLIC_SAFETY_PRIVATE_RULES_7 }}
          PUBLIC_SAFETY_PRIVATE_RULES_8: ${{ secrets.PUBLIC_SAFETY_PRIVATE_RULES_8 }}
          PUBLIC_SAFETY_PRIVATE_RULES_9: ${{ secrets.PUBLIC_SAFETY_PRIVATE_RULES_9 }}
          PUBLIC_SAFETY_PRIVATE_RULES_10: ${{ secrets.PUBLIC_SAFETY_PRIVATE_RULES_10 }}
          PUBLIC_SAFETY_PRIVATE_RULES_11: ${{ secrets.PUBLIC_SAFETY_PRIVATE_RULES_11 }}
          PUBLIC_SAFETY_PRIVATE_RULES_12: ${{ secrets.PUBLIC_SAFETY_PRIVATE_RULES_12 }}
          PUBLIC_SAFETY_REQUIRE_PRIVATE_RULES: ${{ secrets.PUBLIC_SAFETY_REQUIRE_PRIVATE_RULES }}
        run: python3 tools/public_safety_scan.py
